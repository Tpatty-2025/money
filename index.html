<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>珮璇的記帳本</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background-color: #f4f7f6; }
        .summary { display: flex; justify-content: space-between; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .balance { font-size: 1.2em; font-weight: bold; color: #2c3e50; }
        form { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, select, button { margin: 5px 0; padding: 10px; width: 100%; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #219150; }
        .clear-btn { background-color: #95a5a6; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .type-income { color: #27ae60; }
        .type-expense { color: #e74c3c; }
    </style>
</head>
<body>

    <h2>💰 2026記帳本 💰</h2>

    <div class="summary">
        <div>總收入: <span id="total-income">$0</span></div>
        <div>總支出: <span id="total-expense">$0</span></div>
        <div class="balance">當前餘額: <span id="net-balance">$0</span></div>
    </div>

    <form id="record-form">
        <input type="date" id="date" required>
        <select id="type">
            <option value="expense">支出</option>
            <option value="income">收入</option>
        </select>
        <input type="text" id="item" placeholder="品項名稱" required>
        <input type="number" id="amount" placeholder="金額" required>
        <button type="submit">新增紀錄</button>
        <button type="button" class="clear-btn" onclick="clearAll()">清空所有紀錄</button>
    </form>

    <table id="record-table">
        <thead>
            <tr>
                <th>日期</th>
                <th>類型</th>
                <th>品項</th>
                <th>金額</th>
            </tr>
        </thead>
        <tbody id="record-list"></tbody>
    </table>

    <script>
        const form = document.getElementById('record-form');
        const list = document.getElementById('record-list');
        
        // 1. 初始化資料：嘗試從 LocalStorage 讀取，若無則為空陣列
        let records = JSON.parse(localStorage.getItem('myRecords')) || [];

        // 網頁開啟時先執行一次渲染
        renderRecords();

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const newRecord = {
                date: document.getElementById('date').value,
                type: document.getElementById('type').value,
                item: document.getElementById('item').value,
                amount: parseFloat(document.getElementById('amount').value)
            };

            // 2. 存入陣列並儲存到 LocalStorage
            records.push(newRecord);
            saveAndRender();
            form.reset();
        });

        function saveAndRender() {
            // 將陣列轉為 JSON 字串存入
            localStorage.setItem('myRecords', JSON.stringify(records));
            renderRecords();
        }

        function renderRecords() {
            document.getElementById('date').valueAsDate = new Date();
            list.innerHTML = '';
            let totalIn = 0;
            let totalOut = 0;
            records.sort((a, b) => new Date(b.date) - new Date(a.date));
            records.forEach((rec) => {
                if (rec.type === 'income') totalIn += rec.amount;
                else totalOut += rec.amount;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${rec.date}</td>
                    <td class="${rec.type === 'income' ? 'type-income' : 'type-expense'}">
                        ${rec.type === 'income' ? '收入' : '支出'}
                    </td>
                    <td>${rec.item}</td>
                    <td>$${rec.amount}</td>
                `;
                list.appendChild(row);
            });

            document.getElementById('total-income').innerText = `$${totalIn}`;
            document.getElementById('total-expense').innerText = `$${totalOut}`;
            document.getElementById('net-balance').innerText = `$${totalIn - totalOut}`;
        }

        function clearAll() {
            if (confirm('確定要刪除所有紀錄嗎？')) {
                records = [];
                saveAndRender();
            }
        }
    </script>
</body>
</html>
