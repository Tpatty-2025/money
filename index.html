<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>珮璇的記帳本</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; background-color: #f4f7f6; }
        .summary { display: flex; justify-content: space-between; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .balance { font-size: 1.2em; font-weight: bold; color: #2c3e50; }
        .month-filter { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .month-filter h3 { margin: 0; flex-grow: 1; }
        form { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
        .form-group { display: flex; flex-direction: column; }
        input, select, button { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #27ae60; color: white; border: none; cursor: pointer; height: 38px; }
        button:hover { background-color: #219150; }
        .export-btn { background-color: #3498db; }
        .export-btn:hover { background-color: #2980b9; }
        .del-btn { background-color: #ff7675; padding: 5px 10px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: center; }
        th { background-color: #ecf0f1; }
        .type-income { color: #27ae60; font-weight: bold; }
        .type-expense { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

    <h2>💰記帳本💰</h2>

    <div class="month-filter">
        <h3>月份檢視</h3>
        <input type="month" id="view-month" onchange="changeViewMonth()">
        <button type="button" class="export-btn" onclick="exportToExcel()">匯出本月 .xlsx</button>
    </div>

    <div class="summary">
        <div>該月收入: <span id="total-income">$0</span></div>
        <div>該月支出: <span id="total-expense">$0</span></div>
        <div class="balance">該月結餘: <span id="net-balance">$0</span></div>
    </div>

    <form id="record-form">
        <div class="form-group"><label>日期</label><input type="date" id="date" required></div>
        <div class="form-group">
            <label>類型</label>
            <select id="type"><option value="expense">支出</option><option value="income">收入</option></select>
        </div>
        <div class="form-group"><label>品項</label><input type="text" id="item" placeholder="品項" required></div>
        <div class="form-group"><label>金額</label><input type="number" id="amount" placeholder="金額" required></div>
        <button type="submit">新增</button>
    </form>

    <table id="record-table">
        <thead>
            <tr><th>日期</th><th>類型</th><th>品項</th><th>金額</th><th>操作</th></tr>
        </thead>
        <tbody id="record-list"></tbody>
    </table>

    <script>
        const viewMonthInput = document.getElementById('view-month');
        const list = document.getElementById('record-list');
        let records = JSON.parse(localStorage.getItem('myRecords')) || [];
        
        // 初始化日期
        const today = new Date();
        viewMonthInput.value = today.toISOString().slice(0, 7);
        document.getElementById('date').valueAsDate = today;

        renderRecords();

        function changeViewMonth() { renderRecords(); }

        document.getElementById('record-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const dateVal = document.getElementById('date').value;
            const newRecord = {
                id: Date.now(),
                date: dateVal,
                type: document.getElementById('type').value,
                item: document.getElementById('item').value,
                amount: parseFloat(document.getElementById('amount').value)
            };
            records.push(newRecord);
            viewMonthInput.value = dateVal.slice(0, 7);
            saveAndRender();
            this.reset();
            document.getElementById('date').valueAsDate = new Date();
        });

        function deleteRecord(id) {
            if (confirm('確定要刪除嗎？')) {
                records = records.filter(rec => rec.id !== id);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('myRecords', JSON.stringify(records));
            renderRecords();
        }

        function renderRecords() {
            list.innerHTML = '';
            let totalIn = 0, totalOut = 0;
            const selectedMonth = viewMonthInput.value;
            const filteredRecords = records.filter(rec => rec.date.startsWith(selectedMonth));
            filteredRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

            filteredRecords.forEach((rec) => {
                if (rec.type === 'income') totalIn += rec.amount;
                else totalOut += rec.amount;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${rec.date}</td>
                    <td class="${rec.type === 'income' ? 'type-income' : 'type-expense'}">${rec.type === 'income' ? '收入' : '支出'}</td>
                    <td>${rec.item}</td>
                    <td>$${rec.amount}</td>
                    <td><button class="del-btn" onclick="deleteRecord(${rec.id})">刪除</button></td>
                `;
                list.appendChild(row);
            });
            document.getElementById('total-income').innerText = `$${totalIn}`;
            document.getElementById('total-expense').innerText = `$${totalOut}`;
            document.getElementById('net-balance').innerText = `$${totalIn - totalOut}`;
        }

        // --- 核心匯出功能 ---
        function exportToExcel() {
            // 檢查函式庫是否載入成功
            if (typeof XLSX === 'undefined') {
                alert('報表元件讀取中或讀取失敗，請確認網路連線並重新整理網頁。');
                return;
            }

            const selectedMonth = viewMonthInput.value;
            const filteredRecords = records.filter(rec => rec.date.startsWith(selectedMonth));

            if (filteredRecords.length === 0) {
                alert("本月沒有資料可以匯出喔！");
                return;
            }

            // 準備數據
            const data = [["日期", "類型", "品項", "金額"]];
            let tin = 0, tout = 0;

            filteredRecords.forEach(rec => {
                const typeText = rec.type === 'income' ? '收入' : '支出';
                if (rec.type === 'income') tin += rec.amount; else tout += rec.amount;
                data.push([rec.date, typeText, rec.item, rec.amount]);
            });

            data.push([]); // 空行
            data.push(["", "", "總收入", tin]);
            data.push(["", "", "總支出", tout]);
            data.push(["", "", "當月結餘", tin - tout]);

            // 執行匯出
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, ws, "Sheet1");
            
            // 注意：這裡修正一個可能的變數名稱錯誤
            XLSX.writeFile(wb, `記帳報表_${selectedMonth}.xlsx`);
        }
    </script>
</body>
</html>
